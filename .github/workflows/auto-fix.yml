# Auto-fix workflow - automatically fixes formatting and linting issues
# Runs on PR creation/update and pushes fixes back to the branch
#
# This reduces CI failures by auto-correcting common issues before
# the main CI checks run.

name: Auto-fix Code Quality

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, dev]

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  auto-fix:
    name: 🔧 Auto-fix
    runs-on: ubuntu-latest
    # Don't run on forks (they can't push back)
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier fix
        run: npm run format
        continue-on-error: true

      - name: Run ESLint fix
        run: npm run lint:fix
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push fixes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "chore: auto-fix formatting and linting issues"
          git push
